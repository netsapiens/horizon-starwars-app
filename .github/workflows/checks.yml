name: Checks

# Typecheck on every push and pull request.
#
# tsc is the point of this workflow. The build runs through babel-loader with
# @babel/preset-typescript, which STRIPS types without checking them — so the
# bundle compiles regardless of how wrong the types are, and nothing in the
# deploy path would otherwise notice. The SDK's compile-time guarantees (a
# mistyped scope tier being a build error, for one) only hold if this runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The character index is hand-maintained community JSON whose field TYPES
      # are not stable — `masters` is an array on some records and a bare string
      # on others, which took the detail panel down with "value.join is not a
      # function" before the API layer started coercing them. tsc cannot catch
      # that: an interface is erased at build time and says nothing about what
      # actually arrives. So this runs the real normalizer over the live
      # document. It needs the network, and a source outage will fail the job —
      # that is the trade for catching the next shape change here rather than in
      # somebody's browser.
      - name: Character index shape
        if: '!cancelled()'
        run: npm run check:index
